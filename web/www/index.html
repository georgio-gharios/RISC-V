<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rv-doom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">rv-doom <span class="dim">RV32IM</span></div>
    <div class="stats">
      <div class="stat big"><span id="mips">0.0</span><label>MIPS</label></div>
      <div class="stat"><span id="fps">0</span><label>fps</label></div>
      <div class="stat"><span id="instret">0</span><label>instructions</label></div>
    </div>
    <div class="controls">
      <select id="program"></select>
      <button id="run">Pause</button>
      <button id="step">Step</button>
      <button id="reset">Reset</button>
    </div>
  </header>

  <main>
    <section class="screen">
      <div class="screen-wrap">
        <canvas id="screen" width="320" height="200" tabindex="0"></canvas>
        <pre id="debug" hidden></pre>
      </div>
      <div class="help dim">Arrows move · Ctrl fire · Space use · Shift run · Alt strafe · Enter/Esc menu · ` debug overlay</div>
      <pre id="console"></pre>
    </section>

    <aside class="panel">
      <h2>Current instruction</h2>
      <div id="disasm" class="mono">—</div>
      <div id="status" class="mono warn"></div>
      <h2>Registers</h2>
      <div class="pc mono"><span class="dim">pc</span> <span id="pc">00000000</span></div>
      <div id="regs" class="regs mono"></div>
    </aside>
  </main>
  <script src="main.js"></script>
</body>
</html>
